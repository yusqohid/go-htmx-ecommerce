<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} - Sellora{{ else }}Sellora - Akses Akun{{ end }}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/admin/images/favicon.ico">

  <!-- Core CSS Assets -->
  <link rel="stylesheet" href="/static/admin/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/admin/libs/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/storefront/css/storefront.css">

  <!-- HTMX (Self-Hosted) -->
  <script src="/static/libs/htmx/htmx.min.js"></script>
  <script>
    function getCSRFToken() {
      const match = document.cookie.match(/(^|;)\s*sellora_csrf=([^;]+)/);
      return match ? decodeURIComponent(match[2].trim()) : "";
    }
    function attachCSRF(f) {
      if (f && f.method && f.method.toUpperCase() === "POST") {
        const token = getCSRFToken();
        if (token) {
          let inp = f.querySelector("input[name='csrf_token']");
          if (!inp) {
            inp = document.createElement("input");
            inp.type = "hidden";
            inp.name = "csrf_token";
            f.appendChild(inp);
          }
          inp.value = token;
        }
      }
    }
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("form").forEach(attachCSRF);
    });
    document.addEventListener("submit", function(evt) {
      if (evt.target && evt.target.tagName === "FORM") {
        attachCSRF(evt.target);
      }
    }, true);
    document.addEventListener("htmx:configRequest", function(evt) {
      const token = getCSRFToken();
      if (token) {
        evt.detail.headers["X-CSRF-Token"] = token;
      }
    });
  </script>
</head>
<body class="min-vh-100 d-flex flex-column justify-content-between">
  <!-- Minimal Top Header -->
  <header class="py-3 border-bottom bg-white">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="/" class="storefront-brand">
        <span class="brand-icon-spark">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(50,50)">
              <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" />
              <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" transform="rotate(60)" />
              <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" transform="rotate(120)" />
            </g>
          </svg>
        </span>
        <span>Sellora</span>
      </a>
      <a href="/" class="text-muted small text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Kembali ke Toko
      </a>
    </div>
  </header>

  <!-- Auth Content Container -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
    {{ template "content" . }}
  </main>

  <!-- Clean Footer -->
  <footer class="py-3 border-top bg-white text-center text-muted small">
    <div class="container">
      &copy; 2026 Sellora &bull; Platform E-Commerce Produk Digital
    </div>
  </footer>
</body>
</html>
