<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Sellora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">
    <header class="py-6 px-4 sm:px-6 lg:px-8 border-b border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="text-2xl font-black tracking-tight text-indigo-600 flex items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <span>Sellora</span>
            </a>
            <div class="text-sm text-slate-500">
                Digital Product Commerce
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        {{ template "content" . }}
    </main>

    <footer class="py-6 border-t border-slate-200 text-center text-xs text-slate-400">
        &copy; 2026 Sellora. Single-vendor digital product commerce platform.
    </footer>
</body>
</html>
