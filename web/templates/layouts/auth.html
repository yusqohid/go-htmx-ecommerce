<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} - Sellora{{ else }}Sellora - Account Access{{ end }}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/admin/images/favicon.ico">

  <!-- Core CSS Assets (Local Bootstrap 5) -->
  <link rel="stylesheet" href="/static/admin/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/admin/libs/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/storefront/css/storefront.css">

  <!-- HTMX (Self-Hosted) -->
  <script src="/static/libs/htmx/htmx.min.js"></script>
  <script>
    function getCSRFToken() {
      const match = document.cookie.match(/(^|;)\s*sellora_csrf=([^;]+)/);
      return match ? decodeURIComponent(match[2].trim()) : "";
    }
    function attachCSRF(f) {
      if (f && f.method && f.method.toUpperCase() === "POST") {
        const token = getCSRFToken();
        if (token) {
          let inp = f.querySelector("input[name='csrf_token']");
          if (!inp) {
            inp = document.createElement("input");
            inp.type = "hidden";
            inp.name = "csrf_token";
            f.appendChild(inp);
          }
          inp.value = token;
        }
      }
    }
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("form").forEach(attachCSRF);
    });
    document.addEventListener("submit", function(evt) {
      if (evt.target && evt.target.tagName === "FORM") {
        attachCSRF(evt.target);
      }
    }, true);
    document.addEventListener("htmx:configRequest", function(evt) {
      const token = getCSRFToken();
      if (token) {
        evt.detail.headers["X-CSRF-Token"] = token;
      }
    });
  </script>

  <style>
    body {
      background-color: #f8fafc;
    }
    .auth-brand {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      color: #0f172a;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      padding: 2.25rem 2rem;
    }
    @media (min-width: 576px) {
      .auth-card {
        padding: 2.75rem 2.5rem;
      }
    }
    .form-control:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body class="min-vh-100 d-flex flex-column justify-content-between">
  <!-- Minimal Top Header -->
  <header class="py-4 border-bottom bg-white">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="/" class="auth-brand">
        <i class="bi bi-bag-check-fill text-success"></i>
        <span>Sellora</span>
      </a>
      <div class="text-muted small d-none d-sm-inline">
        Digital Product Commerce
      </div>
    </div>
  </header>

  <!-- Auth Content Center Container -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
    {{ template "content" . }}
  </main>

  <!-- Clean Footer -->
  <footer class="py-4 border-top bg-white text-center text-muted small">
    <div class="container">
      &copy; 2026 Sellora. Single-vendor digital product commerce platform.
    </div>
  </footer>
</body>
</html>
