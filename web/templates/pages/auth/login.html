{{ define "content" }}
<div class="w-100" style="max-width: 440px;">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">Sign in to Sellora</h1>
      <p class="text-muted small">Enter your credentials to access your account</p>
    </div>

    {{ if .Error }}
    <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small mb-4" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <div>{{ .Error }}</div>
    </div>
    {{ end }}

    <form method="POST" action="/login">
      {{ if .CSRFToken }}
      <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
      {{ end }}
      <input type="hidden" name="redirect" value="{{ .Redirect }}">

      <div class="mb-3">
        <label for="email" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          value="{{ .Email }}" 
          required 
          autocomplete="email"
          placeholder="you@example.com"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-4">
        <label for="password" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password"
          placeholder="••••••••"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-success w-100 py-2 fs-6 fw-semibold rounded-3 shadow-sm mb-3"
      >
        Sign In
      </button>
    </form>

    <div class="pt-3 border-top text-center text-muted small">
      Don't have an account yet? 
      <a href="/register" class="text-success text-decoration-none fw-semibold ms-1">Create an account</a>
    </div>
  </div>
</div>
{{ end }}
