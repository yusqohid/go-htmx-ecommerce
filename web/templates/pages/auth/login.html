{{ define "content" }}
<div class="w-100" style="max-width: 440px;">
  <div class="spark-card">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">Masuk ke Sellora</h1>
      <p class="text-muted small">Masukkan email dan kata sandi akun Anda</p>
    </div>

    {{ if .Error }}
    <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small mb-4" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <div>{{ .Error }}</div>
    </div>
    {{ end }}

    <form method="POST" action="/login">
      {{ if .CSRFToken }}
      <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
      {{ end }}
      <input type="hidden" name="redirect" value="{{ .Redirect }}">

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-secondary">Alamat Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          value="{{ .Email }}" 
          required 
          autocomplete="email"
          placeholder="nama@email.com"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold text-secondary">Kata Sandi</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password"
          placeholder="••••••••"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-spark-primary w-100 py-2.5 fs-6 fw-semibold mb-3"
      >
        Masuk
      </button>
    </form>

    <div class="pt-3 border-top text-center text-muted small">
      Belum memiliki akun? 
      <a href="/register" class="text-dark text-decoration-none fw-semibold ms-1">Daftar sekarang</a>
    </div>
  </div>
</div>
{{ end }}
