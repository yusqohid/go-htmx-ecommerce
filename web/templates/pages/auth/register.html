{{ define "content" }}
<div class="w-100" style="max-width: 440px;">
  <div class="spark-card">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">Daftar Akun Baru</h1>
      <p class="text-muted small">Dapatkan akses langsung ke produk digital dan unduhan Anda</p>
    </div>

    {{ if .Error }}
    <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small mb-4" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <div>{{ .Error }}</div>
    </div>
    {{ end }}

    <form method="POST" action="/register">
      {{ if .CSRFToken }}
      <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
      {{ end }}

      <div class="mb-3">
        <label for="name" class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          value="{{ .Name }}" 
          required 
          autocomplete="name"
          placeholder="Nama Lengkap"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-secondary">Alamat Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          value="{{ .Email }}" 
          required 
          autocomplete="email"
          placeholder="nama@email.com"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-secondary">Kata Sandi</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          minlength="8"
          autocomplete="new-password"
          placeholder="Minimal 8 karakter"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-4">
        <label for="password_confirm" class="form-label small fw-semibold text-secondary">Konfirmasi Kata Sandi</label>
        <input 
          type="password" 
          id="password_confirm" 
          name="password_confirm" 
          required 
          minlength="8"
          autocomplete="new-password"
          placeholder="Ulangi kata sandi"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-spark-primary w-100 py-2.5 fs-6 fw-semibold mb-3"
      >
        Daftar Akun
      </button>
    </form>

    <div class="pt-3 border-top text-center text-muted small">
      Sudah memiliki akun? 
      <a href="/login" class="text-dark text-decoration-none fw-semibold ms-1">Masuk</a>
    </div>
  </div>
</div>
{{ end }}
