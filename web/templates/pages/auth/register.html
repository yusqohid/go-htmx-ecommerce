{{ define "content" }}
<div class="w-100" style="max-width: 440px;">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">Create your account</h1>
      <p class="text-muted small">Get instant access to digital downloads and orders</p>
    </div>

    {{ if .Error }}
    <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small mb-4" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <div>{{ .Error }}</div>
    </div>
    {{ end }}

    <form method="POST" action="/register">
      {{ if .CSRFToken }}
      <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
      {{ end }}

      <div class="mb-3">
        <label for="name" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          value="{{ .Name }}" 
          required 
          autocomplete="name"
          placeholder="John Doe"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          value="{{ .Email }}" 
          required 
          autocomplete="email"
          placeholder="you@example.com"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <div class="mb-4">
        <label for="password_confirm" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Confirm Password</label>
        <input 
          type="password" 
          id="password_confirm" 
          name="password_confirm" 
          required 
          minlength="8"
          autocomplete="new-password"
          placeholder="Repeat password"
          class="form-control rounded-3 py-2 px-3 fs-6"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-success w-100 py-2 fs-6 fw-semibold rounded-3 shadow-sm mb-3"
      >
        Register Account
      </button>
    </form>

    <div class="pt-3 border-top text-center text-muted small">
      Already have an account? 
      <a href="/login" class="text-success text-decoration-none fw-semibold ms-1">Sign In</a>
    </div>
  </div>
</div>
{{ end }}
